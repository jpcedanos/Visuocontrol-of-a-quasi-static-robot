name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install packages
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  sketch:
    name: Compile Processing sketch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download Processing 4.3
        run: |
          curl -sSL -o processing.tgz https://github.com/processing/processing4/releases/download/processing-1293-4.3/processing-4.3-linux-x64.tgz
          tar xzf processing.tgz
      - name: Compile
        run: |
          # Processing needs the sketch folder named after the main .pde
          mkdir -p build/robotic_arm
          cp robotic_arm.pde build/robotic_arm/
          processing-4.3/processing-java --sketch="$PWD/build/robotic_arm" --output="$PWD/build/out" --force --build
